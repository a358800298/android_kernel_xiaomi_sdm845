name: Build Kernel

on:
  push:
    branches: [ "lineage-21" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Initialize
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential libssl-dev libelf-dev libncurses-dev bison flex dwarves zstd

    - name: Set Environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV

    - name: Configure
      run: |
        make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- sdm845-perf_defconfig

    - name: Compile
      run: |
        make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image.gz dtbo.img

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-artifacts
        path: |
          arch/arm64/boot/Image.gz
          arch/arm64/boot/dtbo.img
